name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - run: npm run security:scan

  go:
    name: Go CLI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go vet ./cmd/laura ./internal/...
      - run: go test ./cmd/laura ./internal/...
      - run: go build -trimpath -ldflags="-s -w" -o /tmp/laura ./cmd/laura
